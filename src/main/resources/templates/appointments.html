<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список приемов</title>
  <link rel="stylesheet" href="/css/styles.css"> <!-- Подключение стилей -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="/appointments.js"></script> <!-- Подключение JavaScript-файла -->
</head>
<body>
<nav>
  <ul class="navbar">
    <li><a href="/patients">Пациенты</a></li>
    <li><a href="/surgeons">Хирурги</a></li>
    <li><a href="/appointments">Приемы</a></li>
  </ul>
</nav>
<div class="container">
  <h1>Список приемов</h1>
  <table id="appointmentsTable">
    <thead>
    <tr>
      <th>ID</th>
      <th>Дата и время</th>
      <th>Тип приема</th>
      <th>Тип операции</th>
      <th>Хирург</th>
      <th>Пациент</th>
      <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <!-- Данные приемов будут добавлены сюда с помощью JavaScript -->
    </tbody>
  </table>
  <button id="addAppointmentBtn">Добавить прием</button>
</div>

<!-- Модальное окно для добавления/редактирования приема -->
<div id="appointmentModal" class="modal" style="display:none;">
  <div class="modal-content">
    <span class="close" id="closeModal" style="margin-left: 2px;">&times;</span>
    <h2 id="modalTitle">Добавить прием</h2>
    <input type="hidden" id="appointmentId">
    <div class="form-group">
      <label for="appointmentDateTime">Дата и время:</label>
      <input type="datetime-local" id="appointmentDateTime">
    </div>
    <div class="form-group">
      <label for="appointmentType">Тип приема:</label>
      <input type="text" id="appointmentType">
    </div>
    <div class="form-group">
      <label for="operationType">Тип операции:</label>
      <input type="text" id="operationType">
    </div>
    <div class="form-group">
      <label for="surgeonId">ID хирурга:</label>
      <input type="number" id="surgeonId">
    </div>
    <div class="form-group">
      <label for="patientId">ID пациента:</label>
      <input type="number" id="patientId">
    </div>
    <button id="saveAppointment" style="display: block; margin: 20px auto;">Сохранить</button>
  </div>
</div>
</div>
</body>
</html>
