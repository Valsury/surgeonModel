<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список хирургов</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="/surgeons.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Стили для модальных окон */
    #addSurgeonModal, #editSurgeonModal {
      display: none; /* Скрыто по умолчанию */
      position: fixed; /* Фиксированное положение */
      z-index: 1000; /* На переднем плане */
      left: 0;
      top: 0;
      width: 100%; /* Полная ширина */
      height: 100%; /* Полная высота */
      overflow: auto; /* Прокрутка, если нужно */
      background-color: rgba(0, 0, 0, 0.5); /* Полупрозрачный фон */
    }

    .modal-content {
      background-color: #ffffff; /* Белый фон */
      margin: 15% auto; /* Центрирование */
      padding: 20px; /* Внутренние отступы */
      border: 1px solid #ccc; /* Светло-серая граница */
      border-radius: 8px; /* Закругленные углы */
      width: 80%; /* Ширина модального окна */
      max-width: 600px; /* Максимальная ширина */
    }
  </style>
</head>
<body>
<nav>
  <ul class="navbar">
    <li><a href="/patients">Пациенты</a></li>
    <li><a href="/surgeons">Хирурги</a></li>
    <li><a href="/appointments">Приемы</a></li>
  </ul>
</nav>
<div class="container">
  <h1>Список хирургов</h1>
  <button id="addSurgeon">Добавить хирурга</button>
  <table id="surgeonsTable">
    <thead>
    <tr>
      <th>Имя</th>
      <th>Фамилия</th>
      <th>Отчество</th>
      <th>Дата рождения</th>
      <th>Стаж работы</th>
      <th>Образование</th>
      <th>Контактные данные</th>
      <th>Специализация</th>
      <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
</div>

<div id="addSurgeonModal">
  <div class="modal-content">
    <h2>Добавить хирурга</h2>
    <span class="close" id="closeNewModal" style="margin-left: 2px;">&times;</span>
    <label for="newSurgeonFirstName">Имя:</label>
    <input type="text" id="newSurgeonFirstName" required>
    <label for="newSurgeonLastName">Фамилия:</label>
    <input type="text" id="newSurgeonLastName" required>
    <label for="newSurgeonMiddleName">Отчество:</label>
    <input type="text" id="newSurgeonMiddleName" required>
    <label for="newSurgeonDateOfBirth">Дата рождения:</label>
    <input type="date" id="newSurgeonDateOfBirth" required>
    <label for="newSurgeonYearsOfExperience">Стаж работы:</label>
    <input type="number" id="newSurgeonYearsOfExperience" required>
    <label for="newSurgeonEducation">Образование:</label>
    <input type="text" id="newSurgeonEducation" required>
    <label for="newSurgeonContactDetails">Контактные данные:</label>
    <input type="text" id="newSurgeonContactDetails" required>
    <label for="newSurgeonSpecialization">Специализация:</label>
    <input type="text" id="newSurgeonSpecialization" required>
    <button id="saveNewSurgeon" style="display: block; margin: 20px auto;">Сохранить</button>
  </div>
</div>

<div id="editSurgeonModal">
  <div class="modal-content">
    <span class="close" id="closeEditModal" style="margin-left: 2px;">&times;</span>
    <h2>Редактировать хирурга</h2>
    <input type="hidden" id="editSurgeonId">
    <label for="editSurgeonFirstName">Имя:</label>
    <input type="text" id="editSurgeonFirstName" required>
    <label for="editSurgeonLastName">Фамилия:</label>
    <input type="text" id="editSurgeonLastName" required>
    <label for="editSurgeonMiddleName">Отчество:</label>
    <input type="text" id="editSurgeonMiddleName" required>
    <label for="editSurgeonDateOfBirth">Дата рождения:</label>
    <input type="date" id="editSurgeonDateOfBirth" required>
    <label for="editSurgeonYearsOfExperience">Стаж работы:</label>
    <input type="number" id="editSurgeonYearsOfExperience" required>
    <label for="editSurgeonEducation">Образование:</label>
    <input type="text" id="editSurgeonEducation" required>
    <label for="editSurgeonContactDetails">Контактные данные:</label>
    <input type="text" id="editSurgeonContactDetails" required>
    <label for="editSurgeonSpecialization">Специализация:</label>
    <input type="text" id="editSurgeonSpecialization" required>
    <button id="saveEditSurgeon" style="display: block; margin: 20px auto;">Сохранить изменения</button>
  </div>
</div>

<script>
  $(document).ready(function() {
    // Открытие модального окна для добавления хирурга
    $('#addSurgeon').click(function() {
      $('#addSurgeonModal').show();
    });

    // Закрытие модального окна для добавления хирурга
    $('#closeAddSurgeonModal').click(function() {
      $('#addSurgeonModal').hide();
    });

    // Закрытие модального окна для редактирования хирурга
    $('#closeEditSurgeonModal').click(function() {
      $('#editSurgeonModal').hide();
    });

    // Пример открытия модального окна редактирования
    // $('#editButton').click(function() {
    //     $('#editSurgeonModal').show();
    // });
  });
</script>
</body>
</html>
